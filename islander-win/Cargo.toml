[package]
name = "islander-win"
version = "1.0.0"
edition = "2021"
authors = ["Islander"]
description = "Islander for Windows – Dynamic Island-style overlay"
build = "build.rs"

[[bin]]
name = "islander"
path = "src/main.rs"

[dependencies]
# UI
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# Windows APIs
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    # Core
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    # Window / message loop
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # Input (idle detection)
    "Win32_UI_Input_KeyboardAndMouse",
    # Power / session events
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    # OLE drag-and-drop
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    # Shell (open file, clipboard, thumbnails)
    "Win32_UI_Controls",
    # Clipboard
    "Win32_System_Memory",
    # WASAPI (audio loopback)
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    # SMTC (now playing) - WinRT
    "Media_Control",
    "Media",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP (lyrics)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# FFT (visualizer)
rustfft = "6"

# Audio playback (sounds)
rodio = { version = "0.19", default-features = false, features = ["mp3"] }

# Image decoding (artwork)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Dominant color (accent)
color-thief = "0.2"

# Paths
directories = "5"

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

[build-dependencies]
# Embed Windows manifest and version info
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

